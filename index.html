<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Zylove</title>
    <!-- Site-wide share/search tags. Crawlers only read this file (the app is
         a SPA), so these apply to every URL; pages set their own tab title. -->
    <meta name="description" content="Zylove is a dating app with two modes: Spark for something real, Play for no labels. Phone-verified members, encrypted chat, launching city by city." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zylove" />
    <meta property="og:url" content="https://zylove.app/" />
    <meta property="og:title" content="Zylove · Match your energy." />
    <meta property="og:description" content="Two modes, one you. Spark for something real, Play for no labels. Launching city by city — join a founding circle." />
    <meta property="og:image" content="https://zylove.app/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Zylove app icon" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Zylove · Match your energy." />
    <meta name="twitter:description" content="Two modes, one you. Spark for something real, Play for no labels. Launching city by city." />
    <meta name="twitter:image" content="https://zylove.app/icons/icon-512.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 'black' rather than 'black-translucent': translucent lets the page run
         under the iOS status bar, and the header/nav don't pad for it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Zylove" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#030712" />
  </head>
  <body>
    <!-- For visitors and crawlers without JavaScript (the app is a SPA, so
         this file is every URL's HTML). The business details are carrier
         (A2P 10DLC) requirements for the website — keep them in step with the
         landing page, footer and /sms-terms. -->
    <noscript>
      <main style="max-width:40rem;margin:0 auto;padding:2rem 1rem;font-family:system-ui,sans-serif;line-height:1.6;color:#e5e7eb;background:#030712">
        <h1>Zylove</h1>
        <p>Zylove is a dual-mode dating app for adults 18+, operated by Zylove, LLC. Launching first in Austin, TX.</p>
        <p><strong>Spark</strong> — serious dating, matched on real compatibility, for something worth keeping.</p>
        <p><strong>Play</strong> — casual, adult connections with no labels, on a separate private profile.</p>
        <p>Text messages: one-time sign-in codes, plus account alerts and match and message notifications for people who opt in, and operational alerts for Zylove staff who opt in. Message frequency varies. Msg &amp; data rates may apply. Reply STOP to opt out, HELP for help.</p>
        <p>
          <a href="/terms" style="color:#7c9bff">Terms</a> ·
          <a href="/privacy" style="color:#7c9bff">Privacy</a> ·
          <a href="/sms-terms" style="color:#7c9bff">SMS Terms</a> ·
          <a href="/community" style="color:#7c9bff">Community</a> ·
          <a href="/contact" style="color:#7c9bff">Contact</a>
        </p>
        <p>Zylove, LLC · Austin, Texas · <a href="mailto:support@zylove.app" style="color:#7c9bff">support@zylove.app</a></p>
        <p>© 2026 Zylove, LLC. All rights reserved. JavaScript is required to use the app.</p>
      </main>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- The CSP (vercel.json) allows this inline script by its sha256 hash: change one, update the other. -->
    <script>
      // Not on localhost: a service worker there would cache the dev server.
      if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
        window.addEventListener('load', () => {
          // Check for a new worker on every load, not just the browser's daily check.
          navigator.serviceWorker.register('/sw.js').then((reg) => reg.update())
        })
      }
    </script>
  </body>
</html>
