<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Zylove</title>
    <!-- Site-wide share/search tags. Crawlers only read this file (the app is
         a SPA), so these apply to every URL; pages set their own tab title. -->
    <meta name="description" content="Zylove is a dating app with two modes: Spark for something real, Play for no labels. Phone-verified members, encrypted chat, launching city by city." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zylove" />
    <meta property="og:url" content="https://zylove.app/" />
    <meta property="og:title" content="Zylove · Match your energy." />
    <meta property="og:description" content="Two modes, one you. Spark for something real, Play for no labels. Launching city by city — join a founding circle." />
    <meta property="og:image" content="https://zylove.app/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Zylove app icon" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Zylove · Match your energy." />
    <meta name="twitter:description" content="Two modes, one you. Spark for something real, Play for no labels. Launching city by city." />
    <meta name="twitter:image" content="https://zylove.app/icons/icon-512.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 'black' rather than 'black-translucent': translucent lets the page run
         under the iOS status bar, and the header/nav don't pad for it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Zylove" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#030712" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- The CSP (vercel.json) allows this inline script by its sha256 hash: change one, update the other. -->
    <script>
      // Not on localhost: a service worker there would cache the dev server.
      if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
        window.addEventListener('load', () => {
          // Check for a new worker on every load, not just the browser's daily check.
          navigator.serviceWorker.register('/sw.js').then((reg) => reg.update())
        })
      }
    </script>
  </body>
</html>
